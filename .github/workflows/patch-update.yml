# Free cloud path: pull new patch notes WITHOUT Ollama, mark aiEnriched: false.
# When your PC is on, scripts/auto/local_update.py runs Ollama enrich + push.
#
# Schedule: every 4 hours + manual run. Patch-day notes usually appear
# hours before/around deploy — polling is free and good enough.

name: Patch data update

on:
  schedule:
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-data-update
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest new patches (no AI)
        run: |
          python scripts/ingest/run_ingest.py --years 0.5 --only-new

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --staged --quiet; then
            echo "No patch data changes."
            exit 0
          fi
          git commit -m "data: ingest new patch notes (AI pending)"
          git push
